[project]
name = "movie-data-capture"
version = "7.0.0"
description = "Scrape movie metadata from Japanese AV databases and organize files for Jellyfin/Emby/Kodi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "certifi",
    "cloudscraper>=1.2.71",
    "lxml>=5.0",
    "mechanicalsoup>=1.4.0",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=10.0",
    "pysocks>=1.7",
    "requests>=2.28",
    "urllib3>=1.26",
]

[project.optional-dependencies]
face = [
    "dlib-bin>=20.0",
    "face-recognition>=1.3",
    "face-recognition-models>=0.3",
    "numpy>=1.24",
]
storyline = [
    "cloudscraper>=1.2",
    "mechanicalsoup>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mdc = "mdc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that require network access",
]
